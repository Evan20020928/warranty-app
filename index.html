<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2342a0">
<meta name="robots" content="noindex">
<title>保固維修回報</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="保固回報">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* 版面概念：左側案件清單／表單，右側狀態欄；報告頁以 A4 紙張呈現，像實體服務單一樣有格線與紅色單號 */
:root{
  --bg:#eef0f4;
  --surface:#ffffff;
  --line:#d5d9e3;
  --text:#151a26;
  --muted:#5b6377;
  --ink:#2342a0;          /* 原子筆藍：主色 */
  --ink-soft:#e7ecfb;
  --stamp:#c2303a;        /* 服務單紅色單號 */
  --on-ink:#ffffff;
  --ok:#1d7a4c; --ok-bg:#e3f4ea;
  --warn:#a8670d; --warn-bg:#fbefd9;
  --bad:#c2303a; --bad-bg:#fbe5e6;
  --font-body:"Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10131b; --surface:#191d28; --line:#2c3242; --text:#e8ebf3; --muted:#9aa2b6;
    --ink:#91a8ff; --ink-soft:#232c4a; --stamp:#ff7a82; --on-ink:#0d1020;
    --ok:#5cd39a; --ok-bg:#16322a; --warn:#f0b357; --warn-bg:#3a2c14; --bad:#ff7a82; --bad-bg:#3d1c21;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10131b; --surface:#191d28; --line:#2c3242; --text:#e8ebf3; --muted:#9aa2b6;
  --ink:#91a8ff; --ink-soft:#232c4a; --stamp:#ff7a82; --on-ink:#0d1020;
  --ok:#5cd39a; --ok-bg:#16322a; --warn:#f0b357; --warn-bg:#3a2c14; --bad:#ff7a82; --bad-bg:#3d1c21;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1280px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.2;margin-right:auto}
.brand small{color:var(--muted);font-size:12px;letter-spacing:.08em}
.brand b{font-size:18px;font-weight:900;letter-spacing:.02em}
.nav{display:flex;gap:6px}
.mode{font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.mode.live{color:var(--ok);border-color:currentColor}
.mode.local{color:var(--warn);border-color:currentColor}

.btn{text-decoration:none;color:var(--text);display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:500;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--ink);color:var(--ink)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.btn.pri:hover{filter:brightness(1.08);color:var(--on-ink)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost.on{background:var(--ink-soft);color:var(--ink)}
.btn.danger{color:var(--bad)}
.btn.danger:hover{border-color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}

main{max-width:1280px;margin:0 auto;padding:20px}
.note{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:13px;margin-bottom:14px}

/* status pills */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap;border:1px solid transparent}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-草稿{color:var(--muted);border-color:var(--line)}
.s-已送出{color:var(--ink);background:var(--ink-soft)}
.s-總公司已收件{color:var(--ink);border-color:var(--ink)}
.s-需補件{color:var(--warn);background:var(--warn-bg)}
.s-已核准{color:var(--ok);background:var(--ok-bg)}
.s-已結案{color:var(--muted);background:var(--bg);border-color:var(--line)}

/* list */
.list-head{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:14px}
.list-head h2{font-size:20px;margin-right:auto}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{display:flex;align-items:baseline;gap:8px;padding:8px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer}
.chip b{font-family:var(--font-mono);font-size:20px}
.chip span{font-size:13px;color:var(--muted)}
.chip.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.search{flex:1 1 220px;max-width:320px;padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.table{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:96px 84px minmax(90px,1fr) minmax(150px,1.3fr) minmax(110px,1.3fr) 120px 74px 118px;gap:12px;align-items:center;padding:11px 16px;border-top:1px solid var(--line);cursor:pointer}
.row:first-child{border-top:0}
.row.hd{cursor:default;font-size:12px;color:var(--muted);font-weight:500;background:var(--bg)}
.row:not(.hd):hover{background:var(--ink-soft)}
.row .no{font-family:var(--font-mono);color:var(--stamp);font-weight:700}
.row .sub{display:block;font-size:12px;color:var(--muted)}
.row .cell{min-width:0;overflow-wrap:anywhere}
.miss{color:var(--warn);font-size:12px}
.empty{padding:48px 20px;text-align:center;color:var(--muted)}
.empty p{margin:0 0 14px}
@media (max-width:900px){
  .row.hd{display:none}
  .row{grid-template-columns:1fr auto;grid-template-areas:"no st" "cu cu" "mo mo" "fa fa" "rq ph";gap:2px 12px}
  .row>.c-no{grid-area:no}.row>.c-st{grid-area:st}.row>.c-cu{grid-area:cu}.row>.c-mo{grid-area:mo}.row>.c-fa{grid-area:fa}.row>.c-rq{grid-area:rq}.row>.c-ph{grid-area:ph}.row>.c-dt{display:none}
}

/* form */
.form-wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
@media (max-width:980px){.form-wrap{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:16px}
.card h2{font-size:16px;display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
.card h2 .n{font-family:var(--font-mono);color:var(--ink);font-size:13px}
.card h2 small{font-weight:400;color:var(--muted);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 14px}
.grid .w2{grid-column:span 2}.grid .w4{grid-column:1/-1}
@media (max-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.grid .w2{grid-column:1/-1}}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label{font-size:12px;color:var(--muted);font-weight:500}
.fld label .req{color:var(--stamp)}
.fld input,.fld select,.fld textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:0}
.fld textarea{min-height:84px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--ink);outline:none;box-shadow:0 0 0 3px var(--ink-soft)}
.fld.flash input,.fld.flash textarea,.fld.flash select{background:var(--ink-soft)}
.unit{position:relative}
.unit input{padding-right:46px;font-family:var(--font-mono)}
.unit span{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted);pointer-events:none}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:14px}
.fld .seg input,.seg input{accent-color:var(--ink);width:auto;padding:0;margin:0;flex:none}
.seg label:has(input:checked){border-color:var(--ink);background:var(--ink-soft);color:var(--ink)}
.hint{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.dx{display:flex;gap:8px;align-items:flex-start;font-size:13px;padding:8px 12px;border-radius:8px}
.dx.bad{background:var(--bad-bg);color:var(--bad)}
.dx.ok{background:var(--ok-bg);color:var(--ok)}
.dx b{flex:none}

.drop{border:1.5px dashed var(--line);border-radius:10px;padding:16px;text-align:center;color:var(--muted);cursor:pointer;display:block}
.drop:hover,.drop.over{border-color:var(--ink);color:var(--ink);background:var(--ink-soft)}
.drop input{display:none}
.formphoto{display:grid;grid-template-columns:180px 1fr;gap:16px;align-items:start}
@media (max-width:600px){.formphoto{grid-template-columns:1fr}}
.formphoto .thumb{aspect-ratio:4/3;border-radius:8px;border:1px solid var(--line);background:var(--bg);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px}
.formphoto .thumb img{width:100%;height:100%;object-fit:cover}
.ai-out{font-size:13px;color:var(--muted);margin-top:8px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:12px}
.ph{border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;background:var(--surface)}
.ph .im{aspect-ratio:4/3;background:var(--bg);position:relative}
.ph .im img{width:100%;height:100%;object-fit:cover;display:block}
.ph .im .up{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45);color:#fff;font-size:13px}
.ph .im .x{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;font-size:16px;line-height:1}
.ph .bd{padding:8px;display:flex;flex-direction:column;gap:6px}
.ph select,.ph input{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-size:13px}

.side{position:sticky;top:76px;display:flex;flex-direction:column;gap:16px}
.check{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.check li{display:flex;gap:8px;align-items:center}
.check .bx{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:12px;flex:none}
.check li.done .bx{background:var(--ok);border-color:var(--ok);color:#fff}
.check li.need:not(.done){color:var(--warn)}
.check li small{color:var(--muted);margin-left:auto;font-size:11px}
.actions{display:flex;flex-direction:column;gap:8px}
.actions .btn{justify-content:center}

/* detail */
.detail{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
@media (max-width:1060px){.detail{grid-template-columns:1fr}.detail .side{position:static}}
.pv{display:flex;flex-direction:column;gap:16px}
.pv-wrap{width:calc(794px * var(--s,1));height:calc(1123px * var(--s,1));box-shadow:0 1px 3px rgba(0,0,0,.12),0 8px 24px rgba(20,30,60,.08);border-radius:2px;overflow:hidden;background:#fff}
.pv-wrap .pg{transform:scale(var(--s,1));transform-origin:0 0}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;font-size:13px}
.log li{border-left:2px solid var(--line);padding-left:10px}
.log time{color:var(--muted);font-size:12px;font-family:var(--font-mono)}
.log p{margin:2px 0 0}
.meta{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:2px}

/* A4 report page: always paper colours, independent of theme */
.pg{width:794px;height:1123px;background:#fff;color:#141821;padding:46px 50px 40px;display:flex;flex-direction:column;gap:14px;font-family:var(--font-body);font-size:13px;line-height:1.55;position:relative;overflow:hidden}
.pg-head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2.5px solid #141821;padding-bottom:10px}
.pg-co{font-size:11px;letter-spacing:.12em;color:#555d70}
.pg h1{font-size:26px;font-weight:900;letter-spacing:.08em;margin-top:2px}
.pg-sub{font-size:11.5px;color:#555d70;margin-top:3px}
.pg-no{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.pg-no span{font-size:11px;color:#555d70}
.pg-no b{font-family:var(--font-mono);font-size:30px;color:#c2303a;letter-spacing:.06em;line-height:1}
.pg-tag{font-size:11px;font-weight:700;padding:1px 8px;border:1.5px solid #2342a0;color:#2342a0;border-radius:4px}
.pg h3{font-size:13.5px;font-weight:700;display:flex;align-items:baseline;gap:8px;border-left:4px solid #2342a0;padding-left:8px;margin-top:2px}
.pg h3 small{font-weight:400;color:#555d70;font-size:11.5px}
.kv{width:100%;border-collapse:collapse;table-layout:fixed}
.kv th,.kv td{border:1px solid #9aa1b1;padding:6px 9px;text-align:left;vertical-align:top;overflow-wrap:anywhere}
.kv th{width:108px;background:#f1f3f7;font-weight:500;color:#3c4456;font-size:12px}
.kv td{color:#1b2a6b;font-weight:500}
.kv td.mono{font-family:var(--font-mono)}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid #9aa1b1}
.mgrid>div{padding:8px 10px;border-right:1px solid #d3d7e0;border-bottom:1px solid #d3d7e0}
.mgrid>div:nth-child(4n){border-right:0}
.mgrid>div:nth-last-child(-n+4){border-bottom:0}
.mgrid span{display:block;font-size:11px;color:#555d70}
.mgrid b{font-family:var(--font-mono);font-size:21px;color:#1b2a6b}
.mgrid i{font-style:normal;font-size:11px;color:#555d70;margin-left:3px}
.pg .dx{font-size:12px;padding:6px 10px}
.pg .dx.bad{background:#fbe5e6;color:#a3222c}
.pg .dx.ok{background:#e3f4ea;color:#17643e}
.insp{white-space:pre-wrap;color:#1b2a6b;border:1px solid #d3d7e0;border-radius:4px;padding:8px 10px;margin:0;max-height:150px;overflow:hidden}
.reqbox{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1.5px solid #2342a0;border-radius:6px;padding:9px 12px}
.reqbox b{font-size:15px;color:#2342a0}
.reqbox .urg{font-size:11px;font-weight:700;color:#fff;background:#c2303a;border-radius:3px;padding:1px 7px}
.reqbox span{color:#3c4456}
.hqbox{border:1px dashed #9aa1b1;border-radius:6px;padding:8px 12px;color:#3c4456;white-space:pre-wrap}
.pg-foot{margin-top:auto;display:flex;justify-content:space-between;gap:12px;font-size:11px;color:#555d70;border-top:1px solid #c9ced8;padding-top:8px}
.pg-scan{flex:1;display:flex;align-items:center;justify-content:center;background:#f3f4f7;border:1px solid #d3d7e0;overflow:hidden;min-height:0}
.pg-scan img{max-width:100%;max-height:100%;object-fit:contain}
.pg-photos{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:14px;min-height:0}
.pg-photo{display:flex;flex-direction:column;gap:5px;min-height:0}
.pg-photo .fr{flex:1;min-height:0;background:#f3f4f7;border:1px solid #d3d7e0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.pg-photo img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.pg-photo .cap{font-size:12px;color:#1b2a6b;min-height:36px}
.pg-photo .cap b{color:#2342a0;margin-right:6px}
.pg-photo .cap em{font-style:normal;font-family:var(--font-mono);color:#555d70;margin-right:6px}

/* toast + modal */
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.t{background:var(--text);color:var(--surface);padding:9px 16px;border-radius:8px;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.2);max-width:90vw}
.t.bad{background:var(--bad);color:#fff}
.mask{position:fixed;inset:0;background:rgba(10,14,25,.5);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:var(--surface);border-radius:12px;padding:20px;max-width:480px;width:100%;display:flex;flex-direction:column;gap:12px}
.dlg h3{font-size:17px}
.dlg textarea{width:100%;min-height:220px;font-family:var(--font-body);padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.dlg .row-btn{display:flex;justify-content:flex-end;gap:8px}
.offscreen{position:fixed;left:-12000px;top:0}
@media (prefers-reduced-motion:no-preference){.t{animation:up .2s ease-out}@keyframes up{from{transform:translateY(8px);opacity:0}}}

/* GitHub 版附加樣式 */
.mode{display:flex;align-items:center;gap:8px;border:0;padding:0}
.mode img{width:26px;height:26px;border-radius:50%;border:1px solid var(--line)}
.mode span{font-size:13px;color:var(--muted)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.wide{width:100%;justify-content:center}
.muted{color:var(--muted);font-size:12px}
.pills{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.meta a{color:var(--ink);margin-top:4px}
.dxs{display:flex;flex-direction:column;gap:5px}
.pg-meta{font-size:11.5px;color:#555d70}
.login{max-width:560px;margin:24px auto}
.login h2{font-size:20px;margin-bottom:8px}
.login .lead{color:var(--muted);margin:0 0 14px}
.steps{margin:0 0 18px;padding-left:20px;display:flex;flex-direction:column;gap:10px}
.steps a{color:var(--ink)}
.login form{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:end}
.login form label{grid-column:1/-1}
.login #login-msg{margin-top:12px}
.login .fine{font-size:12px;color:var(--muted);margin:14px 0 0}
.dlg ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.dlg .shot{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border:1px solid var(--line);border-radius:5px;vertical-align:-5px}
.formphoto .drop{display:flex;align-items:center;justify-content:center;min-height:80px}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand"><small>貫捷科技 · 中部分公司 → 北部總公司</small><b>保固維修回報</b></div>
  <nav class="nav" id="nav" style="display:none">
    <a class="btn ghost" id="nav-list" href="#list">案件總覽</a>
    <a class="btn pri" id="nav-new" href="#new">＋ 新增回報</a>
  </nav>
  <button class="btn" id="install" type="button" hidden>
    <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M8 2v8M4.5 6.5 8 10l3.5-3.5M3 13h10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>安裝 App</button>
  <div class="mode" id="mode"></div>
</div></header>
<main id="app"><div class="empty">載入中…</div></main>
<div id="toast"></div>
<div id="modal"></div>
<div id="off" class="offscreen" aria-hidden="true"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
